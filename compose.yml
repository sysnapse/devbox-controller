# devbox controller + agent reference deployment (no docker network create needed)
#
# Three roles, human-readable names:
#   controller: the only container with /var/run/docker.sock mounted; runs app.py
#   agent     : your own agent container; gets only DCA_URL + DCA_TOKEN, no socket
#   devbox    : docker-run dynamically from a template, not listed here
#
# Container names: devbox-controller (controller), devbox-<task> (devbox)
#
# Auth: Bearer token only (segmentation dropped: host cannot create networks)
#   * controller uses network_mode: host and listens on 0.0.0.0:47123
#   * the agent can stay on the default bridge and call the gateway,
#     e.g. http://172.17.0.1:47123; on the host network use http://127.0.0.1:47123
#   * devbox uses the default bridge (no --network flag), cannot reach host loopback
#
# 2026-11-25 rewrite: NO host workspace mount. Each devbox owns an ephemeral
# /workspace inside its own container; a repository is cloned INTO that container
# and every build artifact lives in the container layer. `dc rm` / `dc gc` removes
# the container and everything it built. Nothing persists on the host disk.
# Only two mounts remain: templates (read-only config) and the docker socket.

services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    image: devbox-controller:local
    container_name: devbox-controller
    restart: unless-stopped
    # No custom network is created: the container shares the host network stack.
    network_mode: host
    environment:
      DCA_TOKEN: "${DCA_TOKEN:?set DCA_TOKEN in .env (>=16 characters)}"
      DCA_TEMPLATES_DIR: /templates
      DCA_BIND: "${DCA_BIND:-0.0.0.0}"
      DCA_PORT: "${DCA_PORT:-47123}"
      # Empty = no --network flag for devbox (docker default bridge); no network is created
      DCA_NETWORK: "${DCA_NETWORK:-}"
      DCA_OWNER: "${DCA_OWNER:-agent}"
      DCA_EXEC_TIMEOUT: "${DCA_EXEC_TIMEOUT:-900}"
      DCA_IDLE_HOURS: "${DCA_IDLE_HOURS:-0}"
      # Cap on the NUMBER of owned devbox containers (running AND stopped). Default 8.
      # 0 or negative disables the cap.
      DCA_MAX_TASKS: "${DCA_MAX_TASKS:-8}"
      DCA_ALLOW_TAGS: "${DCA_ALLOW_TAGS:-0}"
      DCA_ALLOW_PRIVATE_URL: "${DCA_ALLOW_PRIVATE_URL:-0}"
      # Optional git credentials, injected into each devbox for in-container clone.
      DCA_GIT_TOKEN: "${DCA_GIT_TOKEN:-}"
      DCA_GIT_USER: "${DCA_GIT_USER:-x-access-token}"
      # Commit identity written into every devbox, so the agent can git clone/commit/push
      # inside the container with its own token. DCA_INJECT_GIT=0 keeps the token on this
      # side (in-container clone then needs credentials another way).
      DCA_INJECT_GIT: "${DCA_INJECT_GIT:-1}"
      DCA_GIT_NAME: "${DCA_GIT_NAME:-sysnapse}"
      DCA_GIT_EMAIL: "${DCA_GIT_EMAIL:-8198069+sysnapse@users.noreply.github.com}"
      GIT_TERMINAL_PROMPT: "0"
    volumes:
      # Read-only template config only. No host workspace is mounted anywhere.
      - ./templates:/templates:ro
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/dca/.ssh:mode=0700
    # Group id that lets the dca user use the socket: gid of the host docker group
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env (see ls -l /var/run/docker.sock)}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Agent placeholder: use your existing agent container instead
  # Key point: on the default bridge dc autodetects the gateway; no DCA_URL needed.
  # agent:
  #   image: <your agent image>
  #   environment:
  #     DCA_PORT: 47123
  #     DCA_TOKEN: ${DCA_TOKEN}
