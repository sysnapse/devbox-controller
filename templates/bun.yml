# bun - Bun runtime and package manager
# image pins an @sha256 digest; tags are rejected by the controller
name: bun
image: oven/bun:1-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
workdir: /workspace
network: default
cpus: 2
memory: 2g
pids: 512
user: "1000:1000"
# Installed at create time with whatever manager the image ships (apk/apt-get/dnf)
packages: [git]
notes: "Bun runtime and package manager"
